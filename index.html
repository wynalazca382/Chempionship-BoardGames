<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turniej Planszówkowy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 Turniej Planszówkowy</h1>
        </header>
        <div class="import-export-bar">
            <button onclick="downloadTournamentExport()" class="btn-tertiary">Eksportuj turniej</button>
            <button onclick="triggerTournamentImport()" class="btn-tertiary">Importuj turniej</button>
            <button onclick="resetTournament()" class="btn-tertiary btn-tertiary-danger">Resetuj turniej</button>
            <input type="file" id="tournament-import" accept="application/json" onchange="handleTournamentImport(event)" hidden>
        </div>

        <!-- Sekcja 1: Wybór gry -->
        <section id="game-selection" class="section active">
            <h2>Wybierz Grę</h2>
            <div class="game-input">
                <input type="text" id="game-name" placeholder="Nazwa gry (np. Catan, Splendor...)">
                <button onclick="selectGame()">Wybierz Grę</button>
            </div>
            <div class="game-config">
                <div class="config-item">
                    <label for="round-count">Liczba rund</label>
                    <input type="number" id="round-count" min="1" max="10" value="2">
                </div>
                <div class="config-item">
                    <label for="min-table-size">Min osób na stole</label>
                    <input type="number" id="min-table-size" min="2" max="8" value="3">
                </div>
                <div class="config-item">
                    <label for="max-table-size">Max osób na stole</label>
                    <input type="number" id="max-table-size" min="2" max="8" value="6">
                </div>
                <div class="config-item">
                    <label for="preferred-table-size">Preferowana liczba osób na stole</label>
                    <input type="number" id="preferred-table-size" min="2" max="8" value="4">
                </div>
                <div class="config-item">
                    <label for="tb-count">Liczba tie-breaker'ów</label>
                    <input type="number" id="tb-count" min="1" max="5" value="3">
                </div>
                <div class="config-item">
                    <label for="tb-method">Metoda rozstrzygania tie-breaker'ów</label>
                    <select id="tb-method">
                        <option value="priority">Priorytet (TB1 → TB2 → TB3...)</option>
                        <option value="sum">Suma</option>
                        <option value="average">Średnia</option>
                        <option value="max">Maksimum</option>
                    </select>
                </div>
                <div class="config-item">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="league-mode">
                        Tryb ligi
                    </label>
                    <input type="number" id="league-weeks" min="2" max="52" value="4" placeholder="Liczba tygodni">
                </div>
                <div class="config-item">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="radio" name="scoring-mode" value="game" id="scoring-game" checked onchange="updateScoringMode()">
                        Punkty z gry
                    </label>
                </div>
                <div class="config-item">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="radio" name="scoring-mode" value="custom" id="scoring-custom" onchange="updateScoringMode()">
                        Custom scoring
                    </label>
                </div>
                <div id="custom-scoring-config" style="display: none; padding: 15px; background: #f5f5f5; border-radius: 8px; margin-top: 12px;">
                    <h4 style="color: #667eea; margin-bottom: 12px;">Punkty za miejsca</h4>
                    <div id="scoring-inputs" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px;"></div>
                </div>
            </div>
            <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e0e0e0;">
                <h3 style="color: #667eea; margin-bottom: 15px;">Szablony turniejów</h3>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button onclick="applyTournamentTemplate('quick')" class="btn-secondary" style="flex: 1; min-width: 150px;">⚡ Quick (3 rundy)</button>
                    <button onclick="applyTournamentTemplate('standard')" class="btn-secondary" style="flex: 1; min-width: 150px;">📋 Standard (4 rundy)</button>
                    <button onclick="applyTournamentTemplate('extended')" class="btn-secondary" style="flex: 1; min-width: 150px;">🏆 Extended (5 rund)</button>
                </div>
            </div>
            <div id="selected-game"></div>
        </section>

        <!-- Sekcja 2: Dodawanie graczy -->
        <section id="player-section" class="section">
            <h2>Dodaj Graczy</h2>
            <div class="player-input">
                <input type="text" id="player-name" placeholder="Imię gracza">
                <button onclick="addPlayer()">Dodaj Gracza</button>
            </div>
            <div id="player-list"></div>
            <div id="attendance-list" class="attendance-list"></div>
            <div id="player-stats" style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e0e0e0;"></div>
            <button onclick="generateTables()" class="btn-primary" id="generate-tables-btn" style="display: none;">
                Losuj Stoły
            </button>
        </section>

        <!-- Sekcja 3: Losowanie stołów -->
        <section id="tables-section" class="section">
            <h2>Stoły</h2>
            <div class="table-config">
                <button onclick="regenerateTables()">Przetasuj Stoły</button>
            </div>
            <div id="tables-display"></div>
            <button onclick="startScoring()" class="btn-primary" id="start-scoring-btn" style="display: none;">
                Rozpocznij Punktację
            </button>
        </section>

        <!-- Sekcja 4: Zliczanie punktów -->
        <section id="scoring-section" class="section">
            <h2>Punktacja</h2>
            <div id="scoring-display"></div>
            <button onclick="finishTournament()" class="btn-primary" id="finish-btn" style="display: none;">
                Zakończ Turniej
            </button>
        </section>

        <!-- Sekcja 5: Podsumowanie -->
        <section id="summary-section" class="section">
            <h2>🏆 Podsumowanie Turnieju</h2>
            <div id="summary-display"></div>
            <div id="summary-actions" class="summary-actions"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
